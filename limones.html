<!DOCTYPE html>
<html>
<head>
  <title>Caza Limones</title>
 <link rel="stylesheet" href="limones.css"/>
 <script src="utils.js"></script>
</head>
<body onload="inicar()">

    <h1>Atrapar Limones</h1>
    <p>Si del cielo te caen limones ..... </p>
    <h2>¡Aprende hacer limonada!</h2>
    <canvas id="areaJuego" width="400" height="400"></canvas>
    <div class="panel">
      <p>Puntaje: <span id="txtPuntaje">0</span></p>
    </div>
    <div class="botones">
      <button onclick="moverIzquierda()">Izquierda</button>
      <button onclick="moverDerecha()" >Derecha</button>
      <button onclick="bajarLimon()">Bajar Limón</button>
      <button onclick="probarAleatorio()">Probar Aleatorio</button>
      <button onclick="actualizarPantalla()">Reiniciar</button>
    </div>
  </div>
 <script src="limones.js"></script>
</body>
</html>
